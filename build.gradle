plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = new Date().format('yyMMdd')
group = project.maven_group

// ============================================================
// 平台化构建
//   gradle build                          → 默认 all（桌面全平台原生库）
//   gradle build -PstarainPlatform=windows|macos|linux|android|all
//
// 每个平台只打包自己需要的 Skia 原生库，产物名带平台后缀：
//   build/libs/starain-<版本>-<平台>[-sources].jar
// ============================================================
def starainPlatform = (findProperty('starainPlatform') ?: 'all').toString().toLowerCase()
// 0.143.18 是第一个同时提供桌面与 Android（arm64/x64）产物的版本，全项目统一用它。
def skijaVersion = (findProperty('skijaVersion') ?: '0.143.18').toString()
def skijaAndroidVersion = (findProperty('skijaAndroidVersion') ?: skijaVersion).toString()

def skijaNatives = [
        windows: ['skija-windows-x64'],
        macos  : ['skija-macos-x64', 'skija-macos-arm64'],
        linux  : ['skija-linux-x64'],
        // Android 单独处理：版本与桌面端不同，见下方 dependencies
        android: [],
        all    : ['skija-windows-x64', 'skija-linux-x64', 'skija-macos-x64', 'skija-macos-arm64'],
]

if (!skijaNatives.containsKey(starainPlatform)) {
    throw new GradleException("未知平台：${starainPlatform}，可选值：${skijaNatives.keySet().join(' / ')}")
}

base {
    archivesName = "${project.archives_base_name}-${starainPlatform}"
}

loom {
    accessWidenerPath = file("src/main/resources/starain.accesswidener")

    runs {
        client {
            // DevAuth 默认关闭，靠这个属性打开。不想每次启动都登录就注释掉这行。
            property 'devauth.enabled', 'true'
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'DevAuth'
        url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1'
        content {
            includeGroup 'me.djtheredstoner'
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    // 开发环境登录正版账号用，只在 runClient 时生效，不会打进发布的 jar。
    modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")

    implementation include('io.github.humbleui:types:0.2.0')
    implementation include("io.github.humbleui:skija-shared:${skijaVersion}")

    // 按平台只打包对应原生库
    skijaNatives[starainPlatform].each { nativeArtifact ->
        implementation include("io.github.humbleui:${nativeArtifact}:${skijaVersion}")
    }

    // Android 原生库与桌面端同版本（0.143.18）。
    // 只用 include 打包，不放进 implementation：这些 jar 里也含整套 Skia 类，
    // 进编译类路径会与 skija-shared 重复，导致依赖冲突解析把 shared 顶到别的版本。
    if (starainPlatform == 'android') {
        include("io.github.humbleui:skija-android-arm64:${skijaAndroidVersion}")
        include("io.github.humbleui:skija-android-x64:${skijaAndroidVersion}")
    }

    // all 变体也带上 Android 原生库，方便一个 jar 覆盖全部平台（含 PojavLauncher）。
    if (starainPlatform == 'all') {
        include("io.github.humbleui:skija-android-arm64:${skijaAndroidVersion}")
        include("io.github.humbleui:skija-android-x64:${skijaAndroidVersion}")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "starain_platform", starainPlatform
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.register('extractRuntimeClasspath', Copy) {//这行gradle任务可以导出编译时所有用到的jar出来
    from configurations.runtimeClasspath
    into "$buildDir/runtimeClasspath"
}

tasks.register('updateVersionInJava') {
    doLast {
        def starainFile = file("src/main/java/today/starain/Starain.java")
        def content = starainFile.text
        def newContent = content.replaceAll(/public static final String VERSION = "[^"]*";/, "public static final String VERSION = \"${project.version}\";")
        if (content != newContent) {
            starainFile.text = newContent
        }
    }
}

// 打出来的 jar 里实际带了哪些平台的 Skia 原生库，构建时打印一眼可见。
tasks.register('printPlatformInfo') {
    doLast {
        println "[Starain] 平台 = ${starainPlatform}"
        println "[Starain] Skija 版本 = ${skijaVersion}"
        println "[Starain] 原生库 = ${skijaNatives[starainPlatform]}"
        if (starainPlatform == 'android') {
            println "[Starain] Android 原生库版本 = ${skijaAndroidVersion}"
        }
    }
}
