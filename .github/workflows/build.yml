# 构建 Starain 的 5 种产物：
#   starain-<日期>-windows.jar   仅带 Windows Skia 原生库
#   starain-<日期>-macos.jar     仅带 macOS 原生库（x64 + arm64）
#   starain-<日期>-linux.jar     仅带 Linux 原生库
#   starain-<日期>-android.jar   仅带 Android 原生库（从 Maven 中央仓库拉取）
#   starain-<日期>-all.jar       桌面全平台原生库
#
# 打包本身与宿主操作系统无关（原生库只是 jar 内的资源文件），
# 因此 5 个产物统一在 ubuntu-latest 上构建，速度快且一致性最好。

name: Build

on:
  push:
    branches: [ mh-dev, mh-dev-android ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ mh-dev, mh-dev-android ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ windows, macos, linux, android, all ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 仓库里没有 gradlew，所以直接用 setup-gradle 安装固定版本（与
      # gradle/wrapper/gradle-wrapper.properties 里的 9.5.1 保持一致）并启用依赖缓存。
      - name: 安装 Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 构建 ${{ matrix.platform }} 产物
        run: gradle build -PstarainPlatform=${{ matrix.platform }} --no-daemon --stacktrace

      - name: 显示产物
        run: ls -lh build/libs

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: starain-${{ matrix.platform }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  # 打 tag（v*）时把 5 个产物汇总成一个 Release
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列出产物
        run: find dist -name '*.jar' | sort

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jar
          generate_release_notes: true
